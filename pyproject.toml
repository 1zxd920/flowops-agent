[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowops-agent"
version = "0.1.0"
description = "A deterministic multi-agent after-sales workflow with tools, retries, idempotency, human handoff, audit logs, and SSE."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xudong Zhao"}]
keywords = ["agent", "mcp", "workflow", "customer-support", "fastapi"]

[project.scripts]
flowops = "flowops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

